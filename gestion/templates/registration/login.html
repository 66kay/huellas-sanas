{% extends "gestion/base.html" %}
{% block titulo %}Ingresar - Huellas Sanas{% endblock %}
{% block contenido %}
<h1>Ingresar</h1>
<form method="post" class="formulario login">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for campo in form %}
        <div class="campo">
            {{ campo.label_tag }}
            {{ campo }}
            {{ campo.errors }}
        </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
</form>
{% endblock %}
